<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee3cb">
<title>楚河漢界｜雙人象棋</title>
<style>
:root{color-scheme:light;--ink:#382719;--muted:#846e55;--paper:#f7f1e5;--board:#e9c98e;--line:#59432e;--red:#a9352a;--black:#292720}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px 38px;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#fffaf0 0,#f2ead9 52%,#e8deca 100%);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}.page{width:min(100%,780px);margin:auto}header{text-align:center;margin:0 0 20px}.eyebrow{margin:0 0 7px;color:#9a7852;font:700 11px/1.4 system-ui,sans-serif;letter-spacing:.28em}h1{margin:0;font-size:clamp(29px,6vw,42px);font-weight:600;letter-spacing:.14em}.subtitle{margin:8px 0 0;color:var(--muted);font-size:14px;letter-spacing:.08em}.table-wrap{padding:clamp(12px,3vw,23px);border:1px solid rgba(94,66,35,.28);border-radius:18px;background:rgba(255,252,244,.72);box-shadow:0 18px 50px rgba(75,52,27,.13),inset 0 1px #ffffffcc}.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:570px;margin:0 auto 14px;padding:11px 14px;border:1px solid #e4d5bd;border-radius:12px;background:#fffaf1;font:14px system-ui,sans-serif}.turn{display:flex;align-items:center;gap:9px;font-weight:700}.turn-dot{width:13px;height:13px;border:1px solid #704d2b;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #a9352a1a}.turn.black .turn-dot{background:#292720;box-shadow:0 0 0 3px #2927201a}.status-message{color:#806c56;text-align:right;font-size:12px}.board-frame{position:relative;width:min(100%,570px);aspect-ratio:9/10;margin:0 auto;padding:4.3%;border:1px solid #8c6439;border-radius:6px;background:linear-gradient(135deg,#f0d69f,#e4bd7b 55%,#edcf96);box-shadow:inset 0 0 0 5px #fff4d133,inset 0 0 30px #5c351a1a,0 5px 12px #4b30131f}#board{display:block;width:100%;height:100%;overflow:visible;touch-action:manipulation}.grid{fill:none;stroke:var(--line);stroke-width:1.15;vector-effect:non-scaling-stroke}.river-cut{fill:var(--board);stroke:none}.river-text{fill:#705335;font-size:19px;font-family:"Noto Serif TC","Songti TC",serif;letter-spacing:8px}.piece{cursor:pointer;transition:opacity .12s}.piece circle{fill:#f7e8c4;stroke:#704d2b;stroke-width:1.7;vector-effect:non-scaling-stroke;filter:drop-shadow(0 1px 1px #36240f38)}.piece .inner{fill:none;stroke:#7d572f7a;stroke-width:.8;vector-effect:non-scaling-stroke}.piece text{pointer-events:none;text-anchor:middle;dominant-baseline:central;font-size:23px;font-weight:700;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}.piece.red text{fill:var(--red)}.piece.black text{fill:var(--black)}.piece.selected circle:first-child{stroke:#d49a32;stroke-width:3.2}.piece.in-check circle:first-child{stroke:#d44732;stroke-width:3.4}.piece[aria-disabled=true]{cursor:default}.mark{fill:none;stroke:#654b32;stroke-width:1.2;stroke-linecap:square;vector-effect:non-scaling-stroke}.target{fill:#526b35a8;stroke:#fff7d9;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}.target.capture{fill:#a9352a40;stroke:#a9352a;stroke-width:2.4}.target:hover{fill:#78924fc9}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:17px auto 0}.controls button{border:1px solid #cdb995;border-radius:9px;padding:9px 15px;background:#fffaf1;color:#60482f;font:600 13px system-ui,sans-serif;cursor:pointer;transition:background .15s,transform .15s}.controls button:hover{background:#f2e5cf;transform:translateY(-1px)}.controls button:disabled{opacity:.45;cursor:default;transform:none}.legend{display:flex;justify-content:center;gap:26px;padding-top:17px;font-size:14px;color:#6e5942}.legend span{display:inline-flex;align-items:center;gap:8px}.dot{width:11px;height:11px;border:1px solid #704d2b;border-radius:50%;background:#f7e8c4}.note{margin:12px 0 0;text-align:center;color:#9a876e;font:12px/1.6 system-ui,sans-serif;letter-spacing:.03em}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:480px){body{padding:20px 10px 26px}header{margin-bottom:15px}.table-wrap{padding:9px;border-radius:13px}.board-frame{padding:4.7%}.piece text{font-size:21px}.river-text{font-size:16px;letter-spacing:5px}.statusbar{padding:9px 10px}.status-message{max-width:48%}}
</style>
</head>
<body><main class="page"><header><p class="eyebrow">CHINESE CHESS · XIANGQI</p><h1>楚河漢界</h1><p class="subtitle">雙人象棋 · 紅方先行</p></header>
<section class="table-wrap" aria-label="雙人象棋遊戲"><div class="statusbar" aria-live="polite"><div class="turn" id="turn"><i class="turn-dot"></i><span id="turnLabel">紅方回合</span></div><div class="status-message" id="message">點選棋子，再點亮起的落點</div></div>
<div class="board-frame"><svg id="board" viewBox="0 0 480 534" role="application" aria-label="象棋棋盤，點選棋子進行移動"><title>雙人象棋棋盤</title><desc>九路十行棋盤，紅黑雙方各十六枚棋子。點選己方棋子，再點選合法落點。</desc><g class="grid" id="grid"></g><g id="river"></g><g id="marks"></g><g id="targets"></g><g id="pieces"></g></svg></div>
<div class="controls"><button type="button" id="undo">↶ 悔棋</button><button type="button" id="reset">重新開始</button></div><div class="legend"><span><i class="dot" style="outline:2px solid #a9352a;outline-offset:1px"></i><b style="color:var(--red)">紅方</b></span><span><i class="dot" style="outline:2px solid #292720;outline-offset:1px"></i><b style="color:var(--black)">黑方</b></span></div><p class="note">九路十行 · 雙方各 16 枚 · 點選棋子查看合法走法</p><p class="sr-only" id="announcer" aria-live="assertive"></p></section></main>
<script>
(()=>{
const NS='http://www.w3.org/2000/svg',grid=document.querySelector('#grid'),river=document.querySelector('#river'),marks=document.querySelector('#marks'),targets=document.querySelector('#targets'),piecesEl=document.querySelector('#pieces'),x0=24,x1=456,y0=24,y1=510,dx=(x1-x0)/8,dy=(y1-y0)/9;
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e},line=(p,a,b,c,d)=>p.appendChild(el('line',{x1:a,y1:b,x2:c,y2:d})),xy=(c,r)=>[x0+c*dx,y0+r*dy];
for(let c=0;c<9;c++){const x=x0+c*dx;if(c===0||c===8)line(grid,x,y0,x,y1);else{line(grid,x,y0,x,y0+4*dy);line(grid,x,y0+5*dy,x,y1)}}for(let r=0;r<10;r++){const y=y0+r*dy;line(grid,x0,y,x1,y)}for(const base of[0,7]){line(grid,...xy(3,base),...xy(5,base+2));line(grid,...xy(5,base),...xy(3,base+2))}const ry=y0+4.5*dy;river.appendChild(el('rect',{x:x0+1,y:ry-12,width:x1-x0-2,height:24,class:'river-cut'}));const rt=el('text',{x:240,y:ry+1,class:'river-text','text-anchor':'middle','dominant-baseline':'central'});rt.textContent='楚 河　　 漢 界';river.appendChild(rt);
for(const[c,r]of[[1,2],[7,2],[0,3],[2,3],[4,3],[6,3],[8,3],[0,6],[2,6],[4,6],[6,6],[8,6],[1,7],[7,7]]){const[cx,cy]=xy(c,r),s=5,g=3;for(const[sign,ok]of[[-1,c>0],[1,c<8]])if(ok){const x=cx+sign*g;line(marks,x,cy-g,x+sign*s,cy-g);line(marks,x,cy-g,x,cy-g+s);line(marks,x,cy+g,x+sign*s,cy+g);line(marks,x,cy+g,x,cy+g-s)}}
const initial=()=>{const b=Array.from({length:10},()=>Array(9).fill(null)),put=(side,row,entries)=>entries.forEach(([c,type])=>b[row][c]={side,type});put('black',0,[[0,'車'],[1,'馬'],[2,'象'],[3,'士'],[4,'將'],[5,'士'],[6,'象'],[7,'馬'],[8,'車']]);put('black',2,[[1,'砲'],[7,'砲']]);put('black',3,[[0,'卒'],[2,'卒'],[4,'卒'],[6,'卒'],[8,'卒']]);put('red',9,[[0,'車'],[1,'馬'],[2,'相'],[3,'仕'],[4,'帥'],[5,'仕'],[6,'相'],[7,'馬'],[8,'車']]);put('red',7,[[1,'炮'],[7,'炮']]);put('red',6,[[0,'兵'],[2,'兵'],[4,'兵'],[6,'兵'],[8,'兵']]);return b};
let board=initial(),turn='red',selected=null,legal=[],history=[],winner=null;
const inside=(c,r)=>c>=0&&c<9&&r>=0&&r<10,enemy=(a,b)=>b&&a.side!==b.side, palace=(s,c,r)=>c>=3&&c<=5&&(s==='red'?r>=7:r<=2), crossed=(s,r)=>s==='red'?r<=4:r>=5;
function pseudo(b,c,r,attacks=false){const p=b[r][c];if(!p)return[];const out=[],add=(x,y)=>{if(inside(x,y)&&(!b[y][x]||enemy(p,b[y][x])||attacks))out.push([x,y])},ray=(dc,dr,screenMode=false)=>{let x=c+dc,y=r+dr,seen=false;while(inside(x,y)){const q=b[y][x];if(screenMode){if(!seen){if(q)seen=true;else add(x,y)}else if(q){if(enemy(p,q)||attacks)out.push([x,y]);break}}else{if(!q)add(x,y);else{if(enemy(p,q)||attacks)out.push([x,y]);break}}x+=dc;y+=dr}};
switch(p.type){case'車':for(const[d,e]of[[1,0],[-1,0],[0,1],[0,-1]])ray(d,e);break;case'炮':case'砲':for(const[d,e]of[[1,0],[-1,0],[0,1],[0,-1]])ray(d,e,true);break;case'馬':for(const[dc,dr,lc,lr]of[[1,2,0,1],[-1,2,0,1],[1,-2,0,-1],[-1,-2,0,-1],[2,1,1,0],[2,-1,1,0],[-2,1,-1,0],[-2,-1,-1,0]])if(inside(c+lc,r+lr)&&!b[r+lr][c+lc])add(c+dc,r+dr);break;case'象':case'相':for(const[dc,dr]of[[2,2],[2,-2],[-2,2],[-2,-2]]){const nr=r+dr,nc=c+dc;if(inside(nc,nr)&&!b[r+dr/2][c+dc/2]&&(p.side==='red'?nr>=5:nr<=4))add(nc,nr)}break;case'士':case'仕':for(const[dc,dr]of[[1,1],[1,-1],[-1,1],[-1,-1]])if(palace(p.side,c+dc,r+dr))add(c+dc,r+dr);break;case'將':case'帥':for(const[dc,dr]of[[1,0],[-1,0],[0,1],[0,-1]])if(palace(p.side,c+dc,r+dr))add(c+dc,r+dr);for(const d of[-1,1]){let y=r+d;while(inside(c,y)){if(b[y][c]){if((b[y][c].type==='帥'||b[y][c].type==='將')&&enemy(p,b[y][c]))add(c,y);break}y+=d}}break;case'卒':case'兵':{const f=p.side==='red'?-1:1;add(c,r+f);if(crossed(p.side,r)){add(c-1,r);add(c+1,r)}break}}
return out}
function king(b,s){for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c];if(p&&p.side===s&&(p.type==='帥'||p.type==='將'))return[c,r]}return null}
function inCheck(b,s){const k=king(b,s);if(!k)return true;for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(b[r][c]?.side!==s&&b[r][c]&&pseudo(b,c,r,true).some(([x,y])=>x===k[0]&&y===k[1]))return true;return false}
function moves(b,c,r){const p=b[r][c];return pseudo(b,c,r).filter(([x,y])=>{const copy=b.map(row=>row.slice());copy[y][x]=copy[r][c];copy[r][c]=null;return !inCheck(copy,p.side)})}
function allMoves(b,s){const out=[];for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(b[r][c]?.side===s)for(const to of moves(b,c,r))out.push([c,r,...to]);return out}
function render(){piecesEl.replaceChildren();targets.replaceChildren();const checked=!winner&&inCheck(board,turn)?king(board,turn):null;if(selected)for(const[c,r]of legal){const[x,y]=xy(c,r),p=board[r][c];targets.appendChild(el('circle',{cx:x,cy:y,r:p?18:6.7,class:`target${p?' capture':''}`,tabindex:0,role:'button','aria-label':`${p?'吃掉':'移到'}${c+1}路第${10-r}行`,'data-c':c,'data-r':r}))}for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=board[r][c];if(!p)continue;const[cx,cy]=xy(c,r),g=el('g',{class:`piece ${p.side}${selected?.[0]===c&&selected?.[1]===r?' selected':''}${checked?.[0]===c&&checked?.[1]===r?' in-check':''}`,role:'button',tabindex:0,'aria-label':`${p.side==='red'?'紅':'黑'}${p.type}，${c+1}路第${10-r}行`,'data-c':c,'data-r':r});g.appendChild(el('circle',{cx,cy,r:21.5}));g.appendChild(el('circle',{cx,cy,r:17.5,class:'inner'}));const t=el('text',{x:cx,y:cy+.5});t.textContent=p.type;g.appendChild(t);piecesEl.appendChild(g)}document.querySelector('#turn').classList.toggle('black',turn==='black');document.querySelector('#turnLabel').textContent=winner?`${winner==='red'?'紅':'黑'}方勝利`:turn==='red'?'紅方回合':'黑方回合';const check=!winner&&inCheck(board,turn),nomoves=!winner&&!allMoves(board,turn).length;document.querySelector('#message').textContent=winner?'將帥被吃，對局結束':nomoves?'無合法走法，對局結束':check?'將軍！請解圍':selected?'請點選標示落點':'點選棋子，再點亮起的落點';document.querySelector('#announcer').textContent=document.querySelector('#message').textContent;document.querySelector('#undo').disabled=!history.length;document.querySelector('#reset').disabled=false}
function choose(c,r){const p=board[r][c];if(winner)return;if(selected&&legal.some(([x,y])=>x===c&&y===r)){const[sc,sr]=selected,captured=board[r][c];history.push({board:board.map(row=>row.map(q=>q&&{...q})),turn,winner});board[r][c]=board[sr][sc];board[sr][sc]=null;selected=null;legal=[];if(captured&&(captured.type==='帥'||captured.type==='將'))winner=turn;else{turn=turn==='red'?'black':'red';if(!allMoves(board,turn).length)winner=turn==='red'?'black':'red'}render();return}if(p?.side===turn){selected=[c,r];legal=moves(board,c,r);render()}else if(selected){selected=null;legal=[];render()}}
function point(e){const n=e.target.closest('[data-c]');if(n)choose(Number(n.dataset.c),Number(n.dataset.r))}document.querySelector('#board').addEventListener('click',point);document.querySelector('#board').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-c]')){e.preventDefault();choose(Number(e.target.dataset.c),Number(e.target.dataset.r))}});document.querySelector('#undo').addEventListener('click',()=>{const h=history.pop();if(h){board=h.board;turn=h.turn;winner=h.winner;selected=null;legal=[];render()}});document.querySelector('#reset').addEventListener('click',()=>{board=initial();turn='red';selected=null;legal=[];history=[];winner=null;render()});render();
})();
</script></body></html>
